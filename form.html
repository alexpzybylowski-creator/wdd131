
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for submitting feedback about a product.">
    <meta name="author" content="Alex Pzybylowski">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Product Review Form</legend>

                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <fieldset class="rating">
                    <legend>Overall Rating</legend>

                    <div class="rating-options">
                        <label for="rating1">
                            <input type="radio" id="rating1" name="rating" value="1" required>
                            <span>☆</span>
                            <span class="rating-number">1</span>
                        </label>

                        <label for="rating2">
                            <input type="radio" id="rating2" name="rating" value="2" required>
                            <span>☆☆</span>
                            <span class="rating-number">2</span>
                        </label>

                        <label for="rating3">
                            <input type="radio" id="rating3" name="rating" value="3" required>
                            <span>☆☆☆</span>
                            <span class="rating-number">3</span>
                        </label>

                        <label for="rating4">
                            <input type="radio" id="rating4" name="rating" value="4" required>
                            <span>☆☆☆☆</span>
                            <span class="rating-number">4</span>
                        </label>

                        <label for="rating5">
                            <input type="radio" id="rating5" name="rating" value="5" required>
                            <span>☆☆☆☆☆</span>
                            <span class="rating-number">5</span>
                        </label>
                    </div>
                </fieldset>

                <label for="installation-date">Date of Installation</label>
                <input type="date" id="installation-date" name="installation-date" required>

                <fieldset>
                    <legend>Which features did you find useful?</legend>

                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="durability">
                        Durability
                    </label>

                    <label for="ease-of-use">
                        <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="design">
                        Design
                    </label>
                </fieldset>

                <label for="review">Written Review <span>(Optional)</span></label>
                <textarea id="review" name="review" rows="6"></textarea>

                <label for="user-name">Your Name <span>(Optional)</span></label>
                <input type="text" id="user-name" name="user-name">

                <input type="submit" value="Submit Review">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Alex Pzybylowski | Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
