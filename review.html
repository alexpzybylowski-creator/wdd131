
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmation page for a submitted product review.">
    <meta name="author" content="Alex Pzybylowski">
    <title>Review Submitted</title>
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Thank You!</h1>
    </header>

    <main>
        <section class="confirmation">
            <h2>Your review has been submitted.</h2>

            <p>
                Thank you for taking the time to review this product.
            </p>

            <p>
                Number of reviews completed:
                <strong id="review-count"></strong>
            </p>

            <a href="form.html">Submit Another Review</a>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Alex Pzybylowski | Brazil</p>
        <p id="lastModified"></p>
    </footer>

    <script>
        let reviewCount = Number(localStorage.getItem("reviewCount")) || 0;

        reviewCount++;

        localStorage.setItem("reviewCount", reviewCount);

        document.querySelector("#review-count").textContent = reviewCount;

        document.querySelector("#currentyear").textContent =
            new Date().getFullYear();

        document.querySelector("#lastModified").textContent =
            `Last Modification: ${document.lastModified}`;
    </script>
</body>
</html>
